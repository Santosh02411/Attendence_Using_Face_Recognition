{% extends 'base.html' %}
{% block content %}
<div class="card wide-card">
    <h2>Student Face Registration</h2>
    <div class="form-grid">
        <div class="form-panel">
            <label>Name</label>
            <input id="name" type="text" placeholder="Student Name" required>
            <label>Roll No</label>
            <input id="roll_no" type="text" placeholder="Roll No" required>
            <label>Branch</label>
            <input id="branch" type="text" placeholder="Branch" required>
            <label>Semester</label>
            <input id="semester" type="text" placeholder="Semester" required>
            <label>Password</label>
            <input id="password" type="password" placeholder="Set your password" required>
            <label>Email (optional)</label>
            <input id="email" type="email" placeholder="For password reset & notifications">
            <label>Phone Number (optional)</label>
            <input id="phone_number" type="tel" placeholder="For SMS notifications">
            <label>Gender</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <button id="registerButton" class="button">Register Student</button>
        </div>
        <div class="form-panel video-panel">
            <div class="camera-frame">
                <video id="video" autoplay muted playsinline webkit-playsinline></video>
                <div class="camera-placeholder" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span>Your camera preview will appear here</span>
                </div>
            </div>
            <canvas id="captureCanvas" style="display:none"></canvas>
            <div class="capture-controls">
                <div class="capture-count">Captured <span id="capturedCount">0</span>/5</div>
                <button id="captureButton" class="button secondary" disabled>Capture Frame</button>
            </div>
        </div>
    </div>
    <div id="resultBox" class="result-box"></div>
</div>
<script>
let stream = null;
let capturedImages = [];

document.getElementById('registerButton').onclick = function() {
    const name = document.getElementById('name').value;
    const roll_no = document.getElementById('roll_no').value;
    const branch = document.getElementById('branch').value;
    const semester = document.getElementById('semester').value;
    const password = document.getElementById('password').value;
    
    if (!name || !roll_no || !branch || !semester || !password) {
        setStatusMessage('resultBox', 'Fill all fields!', 'error');
        return;
    }
    
    capturedImages = [];
    document.getElementById('capturedCount').textContent = '0';
    document.getElementById('captureButton').textContent = 'Capture Frame';
    startCamera();
};

function startCamera() {
    setStatusMessage('resultBox', 'Requesting camera... Make sure to click ALLOW when browser asks!');
    document.getElementById('captureButton').disabled = true;
    
    navigator.mediaDevices.getUserMedia({video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}}})
        .then(function(s) {
            stream = s;
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            // Wait for video to play
            setTimeout(function() {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    setStatusMessage('resultBox', 'Camera is ON! Click "Capture Frame" to capture.', 'success');
                    document.getElementById('captureButton').disabled = false;
                } else {
                    setStatusMessage('resultBox', 'Camera loaded but video not visible. Try refreshing.', 'warning');
                }
            }, 1500);
        })
        .catch(function(err) {
            let msg = err.name;
            if (err.name === 'NotAllowedError') msg = 'Camera permission DENIED. Check browser settings.';
            if (err.name === 'NotFoundError') msg = 'No camera found on device.';
            if (err.name === 'NotReadableError') msg = 'Camera is in use by another app.';
            if (err.name === 'SecurityError') msg = 'Must use LOCALHOST not IP. Go to http://localhost:5000';
            setStatusMessage('resultBox', 'Camera Error: ' + msg, 'error');
            document.getElementById('captureButton').disabled = true;
        });
}

document.getElementById('captureButton').onclick = function() {
    if (capturedImages.length >= 5) {
        uploadImages();
        return;
    }
    
    const video = document.getElementById('video');
    if (!video.srcObject) {
        setStatusMessage('resultBox', 'Camera not active!', 'error');
        return;
    }
    
    const canvas = document.getElementById('captureCanvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    if (canvas.width === 0 || canvas.height === 0) {
        setStatusMessage('resultBox', 'Video not ready. Wait a moment and try again.', 'warning');
        return;
    }
    
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    
    const imgData = canvas.toDataURL('image/jpeg');
    capturedImages.push(imgData);
    document.getElementById('capturedCount').textContent = capturedImages.length;
    if (capturedImages.length >= 5) {
        // The next click on this same button uploads instead of
        // capturing (see the check at the top of this handler) — the
        // label has to change to make that obvious, otherwise it just
        // looks like capturing silently stopped working at 5/5.
        document.getElementById('captureButton').textContent = 'Upload & Register';
        setStatusMessage('resultBox', 'Captured 5/5! Click "Upload & Register" to finish.', 'success');
    } else {
        setStatusMessage('resultBox', 'Captured: ' + capturedImages.length + '/5');
    }
};

function uploadImages() {
    document.getElementById('captureButton').disabled = true;
    setStatusMessage('resultBox', 'Uploading ' + capturedImages.length + ' images...');
    
    const payload = {
        name: document.getElementById('name').value,
        roll_no: document.getElementById('roll_no').value,
        branch: document.getElementById('branch').value,
        semester: document.getElementById('semester').value,
        password: document.getElementById('password').value,
        email: document.getElementById('email').value,
        phone_number: document.getElementById('phone_number').value,
        gender: document.getElementById('gender').value,
        images: capturedImages
    };
    
    fetch('/student/register', {
        method: 'POST',
        headers: csrfHeaders({'Content-Type': 'application/json'}),
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => {
        if (d.status === 'ok') {
            capturedImages = [];
            document.getElementById('capturedCount').textContent = '0';
            document.getElementById('captureButton').disabled = true;
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            {% if oauth_google_enabled %}
            const resultBoxEl = document.getElementById('resultBox');
            resultBoxEl.classList.remove('success', 'error', 'warning');
            resultBoxEl.classList.add('success');
            resultBoxEl.innerHTML =
                'SUCCESS! Student ID: ' + d.student_id + '. ' +
                '<a href="/auth/google/link" class="button small">Connect Google Account (optional)</a> ' +
                'or it will redirect to login shortly.';
            setTimeout(function() {
                window.location.href = '/student/login';
            }, 6000);
            {% else %}
            setStatusMessage('resultBox', 'SUCCESS! Student ID: ' + d.student_id + '. Redirecting to login...', 'success');
            setTimeout(function() {
                window.location.href = '/student/login';
            }, 2000);
            {% endif %}
        } else {
            setStatusMessage('resultBox', 'Error: ' + (d.error || 'Unknown error'), 'error');
            document.getElementById('captureButton').disabled = false;
        }
    })
    .catch(e => {
        setStatusMessage('resultBox', 'Error: ' + e.message, 'error');
        document.getElementById('captureButton').disabled = false;
    });
}
</script>
{% endblock %}
