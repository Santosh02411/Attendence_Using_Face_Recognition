{% extends 'base.html' %}
{% block content %}
<div class="card login-card" id="loginFormCard" style="{% if logged_in %}display: none;{% endif %}">
    <h2>Student Login</h2>
    <form id="studentLoginForm">
        <label>Roll Number</label>
        <input id="roll_no" type="text" placeholder="Enter your roll number" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        {% if config.get('CAPTCHA_ENABLED', True) %}
        <label>Enter the code shown below</label>
        <div class="captcha-row">
            <img src="{{ url_for('captcha_image') }}" alt="CAPTCHA" id="captchaImg" class="captcha-img">
            <button type="button" class="button small" onclick="document.getElementById('captchaImg').src = '{{ url_for('captcha_image') }}?t=' + Date.now();">Refresh</button>
        </div>
        <input id="captcha" type="text" placeholder="Enter the code above" autocomplete="off" required>
        {% endif %}
        <button type="submit">Login</button>
    </form>
    <div id="resultBox" class="result-box"></div>
    <div style="margin-top: 1rem; text-align: center;">
        <span>Not registered? </span><a href="{{ url_for('student_register') }}" style="color: var(--primary); font-weight: 600;">Register here</a>
    </div>
</div>

<div id="sessionsContainer" style="{% if not logged_in %}display: none;{% endif %}">
    <div class="card wide-card">
        <h2>Active Attendance Sessions</h2>
        <p id="welcomeMsg" style="margin-bottom: 1.5rem; font-weight: 600; color: var(--primary);">
            {% if logged_in %}Welcome back, {{ session.student_name }}!{% endif %}
        </p>
        <div id="sessionsList"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    {% if logged_in %}
    loadActiveSessions({{ session.student_id }});
    {% endif %}
});

document.getElementById('studentLoginForm').onsubmit = function(e) {
    e.preventDefault();
    const rollNo = document.getElementById('roll_no').value;
    const password = document.getElementById('password').value;
    const captchaEl = document.getElementById('captcha');
    const captcha = captchaEl ? captchaEl.value : undefined;
    document.getElementById('resultBox').textContent = 'Authenticating...';
    
    fetch('/student/login', {
        method: 'POST',
        headers: csrfHeaders({'Content-Type': 'application/json'}),
        body: JSON.stringify({roll_no: rollNo, password: password, captcha: captcha})
    })
    .then(r => r.json())
    .then(d => {
        if (d.status === 'ok') {
            document.getElementById('resultBox').textContent = 'Welcome, ' + d.student.name;
            document.getElementById('welcomeMsg').textContent = 'Welcome, ' + d.student.name + '!';
            document.getElementById('loginFormCard').style.display = 'none';
            document.getElementById('sessionsContainer').style.display = 'block';
            loadActiveSessions(d.student.id);
            // Refresh to update navbar
            setTimeout(() => window.location.reload(), 1000);
        } else {
            document.getElementById('resultBox').textContent = d.message || 'Login failed. Please check your credentials.';
            document.getElementById('sessionsContainer').style.display = 'none';
            if (captchaEl) {
                document.getElementById('captchaImg').src = '{{ url_for("captcha_image") }}?t=' + Date.now();
                captchaEl.value = '';
            }
        }
    })
    .catch(e => {
        document.getElementById('resultBox').textContent = 'Error: ' + e.message;
    });
};

function loadActiveSessions(studentId) {
    fetch('/get-active-sessions')
        .then(r => r.json())
        .then(d => {
            if (d.sessions && d.sessions.length > 0) {
                let html = '';
                d.sessions.forEach(session => {
                    html += `
                    <div class="session-card" style="border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px;">
                        <h3>${session.title}</h3>
                        <p><strong>Subject:</strong> ${session.subject_name}</p>
                        <p><strong>Available:</strong> ${session.date} to ${session.end_date}</p>
                        <p><strong>Time:</strong> ${session.time_12h} to ${session.end_time_12h} ${session.is_recurring ? '(Daily)' : ''}</p>
                        <button class="button" onclick="attendSession(${session.id}, ${studentId})">Mark Attendance</button>
                    </div>
                    `;
                });
                document.getElementById('sessionsList').innerHTML = html;
                document.getElementById('sessionsContainer').style.display = 'block';
            } else {
                document.getElementById('resultBox').textContent = 'No active sessions available.';
                document.getElementById('sessionsContainer').style.display = 'none';
            }
        })
        .catch(e => {
            document.getElementById('resultBox').textContent = 'Error loading sessions: ' + e.message;
        });
}

function attendSession(sessionId, studentId) {
    window.location.href = '/student/attend?session_id=' + sessionId + '&student_id=' + studentId;
}
</script>
{% endblock %}
