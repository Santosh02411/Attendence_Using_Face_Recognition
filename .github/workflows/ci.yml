name: CI

# Runs the pytest suite on every push and every pull request so a broken
# test can never land on main (or any branch) unnoticed.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches the README's stated minimum; 3.12 is the current
        # default Ubuntu runner Python. Both are exercised so a
        # version-specific regression can't slip through on just one.
        python-version: ['3.9', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # opencv-contrib-python's wheel is self-contained on Linux, but it
      # still links against a couple of system shared libraries that the
      # slim GitHub-hosted image doesn't ship with (headless environments
      # normally have no X11/GL at all). Installing them keeps `import cv2`
      # from failing at collection time.
      - name: Install OpenCV runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        env:
          # Keep tests deterministic/hermetic and independent of any
          # developer's local .env — conftest.py already points the DB
          # and Datasets paths at a temp dir per test, this just makes
          # sure no stray secret/env leaks in from the runner.
          FLASK_SECRET_KEY: ci-test-secret-key-not-for-production
          RATE_LIMIT_ENABLED: '0'
          CAPTCHA_ENABLED: '0'
        run: |
          pytest --maxfail=1 -ra

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: |
            .pytest_cache
          retention-days: 7

  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 3.12 only: ruff/mypy config (pyproject.toml) targets the app's
      # syntax/semantics, not the interpreter running the tools themselves,
      # so one Python version is enough here — unlike the test job's
      # matrix, which needs both 3.9 and 3.12 actually *running* the app.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy

  security:
    name: dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-prod.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-prod.txt

      # Scans the environment's installed package versions (i.e. exactly
      # what requirements*.txt currently resolve to) against the PyPA
      # Advisory Database. Doesn't fail the run silently: a nonzero exit
      # here fails the job, same as a lint or test failure would.
      - name: pip-audit
        run: pip-audit --strict
