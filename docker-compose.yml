# Convenience wrapper around `docker build` + `docker run` with the
# volumes and env file wired up. Not required — plain `docker run` works
# too (see README) — but this is the easiest way to get persistent
# database/Datasets across container restarts/rebuilds right.
#
# Usage:
#   cp .env.example .env   # then fill in FLASK_SECRET_KEY, DEFAULT_ADMIN_PASSWORD
#   docker compose up --build -d

services:
  web:
    build: .
    image: attendance-face-recognition:latest
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    volumes:
      # Student face data and the SQLite databases must survive container
      # restarts/image rebuilds — bind-mounted to the host, not left
      # inside the (ephemeral) container filesystem.
      - ./database:/app/database
      - ./Datasets:/app/Datasets
      # Where backup.py writes archives to (see README "Backup & Restore")
      # — same reasoning: must survive a container restart/rebuild, and
      # ideally lives somewhere with its own backup/retention outside the
      # host too, not just on the same disk as database/.
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Uncomment to put nginx in front of gunicorn (TLS termination, static
  # file serving, etc.) — remember to also set BEHIND_REVERSE_PROXY=1 in
  # .env so request.remote_addr reflects the real client IP instead of
  # nginx's. See README "Deploying behind a reverse proxy" for a sample
  # nginx config.
  # nginx:
