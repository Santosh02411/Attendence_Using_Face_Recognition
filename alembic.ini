[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration filenames.
file_template = %%(rev)s_%%(slug)s

# Timezone used when rendering the date within the migration filename.
# Not used by file_template above, but kept for consistency if that's
# customized later.
timezone = UTC

# sqlalchemy.url is intentionally left blank here: db_migrations.py sets it
# programmatically (from config.DATABASE_PATH / app.DATABASE_PATH) before
# invoking Alembic, since the app supports overriding the database path via
# the DATABASE_PATH env var and the test suite points it at a per-test temp
# directory (see tests/conftest.py). A single static path in this file
# couldn't account for either of those.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
